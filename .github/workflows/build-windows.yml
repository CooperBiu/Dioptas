
name: Build Dioptas 0.5.6 Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      # 1. 从官方仓库下载 0.5.6
      - name: Checkout Dioptas 0.5.6
        uses: actions/checkout@v4
        with:
          repository: Dioptas/Dioptas
          ref: refs/tags/0.5.6
          fetch-depth: 0
          path: source

      # 2. 检查源码版本
      - name: Verify source
        shell: pwsh
        run: |
          git -C source describe --tags
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot identify source version"
          }
          if (-not (Test-Path "source/Dioptas.spec")) {
            throw "Dioptas.spec not found"
          }

      # 3. 设置 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          architecture: x64

      # 4. 安装编译工具
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install setuptools==65.5.1
          pip install wheel==0.41.2
          pip install Cython==0.29.36
          pip install PyInstaller==5.13.2

      # 5. 安装依赖
      - name: Install dependencies
        shell: pwsh
        run: |
          pip install numpy==1.23.5
          pip install scipy==1.10.1
          pip install qtpy==2.4.1
          pip install PyQt5==5.15.9
          pip install pyqtgraph==0.13.3
          pip install h5py==3.8.0
          pip install hdf5plugin
          pip install fabio==2023.4.0
          pip install pyFAI==2023.1.0
          pip install pandas==1.5.3
          pip install lmfit==1.2.2
          pip install scikit-image==0.20.0
          pip install pycifrw
          pip install watchdog==2.1.9
          pip install psutil
          pip install python-dateutil
          pip install matplotlib
          pip install sharedmem
          pip install future extra_data PyOpenGL setuptools_scm==7.1.0

      # 6. 检查依赖
      - name: Check dependencies
        working-directory: source
        shell: pwsh
        run: |
          python -m pip check

      - name: Create version file
        working-directory: source
        shell: pwsh
        run: |
          if (!(Test-Path "dioptas")) {
              throw "dioptas directory not found"
          }
      
          Set-Content -Path "dioptas/__version__" `
            -Value "0.5.6" `
            -NoNewline `
            -Encoding ascii
      
          Set-Content -Path "dioptas/version.py" `
            -Value '__version__ = "0.5.6"' `
            -Encoding ascii

          Write-Host "Version file created:"
          Get-Content "dioptas/__version__"

      # 7. 编译 Cython
      - name: Compile Cython
        working-directory: source
        shell: pwsh
        run: |
          python setup.py build_ext --inplace

      - name: Test source startup
        timeout-minutes: 2
        working-directory: source
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import sys, dioptas; dioptas.excepthook = sys.__excepthook__; sys.argv = ['Dioptas.py', 'test']; dioptas.main()"
          if ($LASTEXITCODE -ne 0) { throw "Source startup failed" }

      # 8. 使用官方 spec 打包
      - name: Build Dioptas EXE
        working-directory: source
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm Dioptas.spec

      - name: Test Windows executable
        working-directory: source
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = Get-Item "dist/Dioptas_Win64_0.5.6/Dioptas.exe"
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "test" -WorkingDirectory $exe.DirectoryName -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            Get-Content "$env:USERPROFILE/dioptas_error.log" -ErrorAction SilentlyContinue
            throw "Executable startup timed out"
          }
          if ($process.ExitCode -ne 0) { throw "Executable startup failed: $($process.ExitCode)" }

      # 9. 上传编译结果
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Dioptas-0.5.6-Windows-x64
          path: source/dist/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
